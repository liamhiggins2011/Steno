<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12403f"/>
      <stop offset="0.55" stop-color="#1f5a59"/>
      <stop offset="1" stop-color="#2D6A6A"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f5f4"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1280" height="520" fill="url(#bg)"/>
  <!-- subtle dotted texture -->
  <g fill="#ffffff" opacity="0.04">
    <circle cx="1120" cy="70" r="150"/>
    <circle cx="90" cy="470" r="120"/>
  </g>

  <!-- Left: wordmark + pitch -->
  <g transform="translate(80,120)">
    <text x="0" y="0" font-size="92" font-weight="800" fill="#ffffff" letter-spacing="-2">Steno</text>
    <text x="4" y="60" font-size="30" font-weight="600" fill="#bfe3e1">Text expansion that can&#8217;t spy on you.</text>

    <text x="4" y="128" font-size="23" fill="#e7f3f2">Type a shortcut, get the whole phrase &#8212; in any app.</text>
    <text x="4" y="162" font-size="23" fill="#e7f3f2">No internet permission. No ads. No accounts. Open source.</text>

    <!-- pills -->
    <g transform="translate(4,205)" font-size="18" font-weight="700">
      <g>
        <rect x="0" y="0" width="300" height="44" rx="22" fill="#0e3736" stroke="#49908e" stroke-width="1.5"/>
        <circle cx="26" cy="22" r="7" fill="none" stroke="#7fe0c8" stroke-width="3"/>
        <rect x="18" y="20" width="16" height="13" rx="3" fill="#7fe0c8"/>
        <text x="46" y="29" fill="#ffffff">ZERO internet permission</text>
      </g>
      <g transform="translate(316,0)">
        <rect x="0" y="0" width="150" height="44" rx="22" fill="#0e3736" stroke="#49908e" stroke-width="1.5"/>
        <text x="24" y="29" fill="#ffffff">100% Kotlin</text>
      </g>
      <g transform="translate(0,56)">
        <rect x="0" y="0" width="180" height="44" rx="22" fill="#0e3736" stroke="#49908e" stroke-width="1.5"/>
        <text x="24" y="29" fill="#ffffff">Free forever</text>
      </g>
      <g transform="translate(196,56)">
        <rect x="0" y="0" width="206" height="44" rx="22" fill="#0e3736" stroke="#49908e" stroke-width="1.5"/>
        <text x="24" y="29" fill="#ffffff">Works system-wide</text>
      </g>
    </g>
  </g>

  <!-- Right: phone showing the expansion -->
  <g transform="translate(878,56)" filter="url(#sh)">
    <rect x="0" y="0" width="322" height="408" rx="38" fill="#0c2b2a"/>
    <rect x="12" y="12" width="298" height="384" rx="28" fill="url(#card)"/>

    <!-- status bar -->
    <text x="40" y="52" font-size="15" font-weight="700" fill="#20514f">9:41</text>
    <g transform="translate(236,40)" fill="#20514f">
      <rect x="0" y="0" width="22" height="12" rx="2"/>
      <rect x="28" y="2" width="20" height="10" rx="2" opacity="0.5"/>
    </g>

    <!-- "before" bubble -->
    <text x="40" y="108" font-size="14" font-weight="700" fill="#7b938f">YOU TYPE</text>
    <rect x="40" y="120" width="130" height="46" rx="12" fill="#2D6A6A"/>
    <text x="60" y="150" font-size="24" font-weight="800" fill="#ffffff" font-family="monospace">;addr</text>

    <!-- arrow -->
    <text x="188" y="152" font-size="30" fill="#2D6A6A">&#8594;</text>

    <!-- "after" expanded -->
    <text x="40" y="208" font-size="14" font-weight="700" fill="#7b938f">STENO WRITES</text>
    <rect x="40" y="220" width="242" height="128" rx="14" fill="#eef5f4" stroke="#cfe3e1" stroke-width="1.5"/>
    <text x="58" y="252" font-size="17" font-weight="600" fill="#143e3d">1180 Raymond Blvd</text>
    <text x="58" y="280" font-size="17" font-weight="600" fill="#143e3d">Suite 400</text>
    <text x="58" y="308" font-size="17" font-weight="600" fill="#143e3d">Newark, NJ 07102</text>

    <!-- footer line -->
    <circle cx="48" cy="368" r="6" fill="none" stroke="#2D6A6A" stroke-width="2.5"/>
    <rect x="41" y="366" width="14" height="11" rx="2.5" fill="#2D6A6A"/>
    <text x="66" y="372" font-size="13" font-weight="700" fill="#2D6A6A">stays on your phone. always.</text>
  </g>
</svg>
